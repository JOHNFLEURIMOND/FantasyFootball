[build]
  command = "NODE_ENV=production npm run build"
  publish = "build"
  functions = "netlify/functions"

[build.environment]
  NPM_FLAGS = "--include=dev"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Public identifiers for the dedicated FantasyFootball property.
# Only production builds receive these values; previews remain disabled.
[context.production.environment]
  GTM_CONTAINER_ID = "GTM-W899JSKK"
  GA4_MEASUREMENT_ID = "G-QPJEV5XHES"
  ANALYTICS_HOSTNAME = "fantasyfootball24.netlify.app"
